# Minimal Configuration for Kine SaaS Backend
spring:
  application:
    name: kine-saas-backend
  config:
    activate:
      on-profile:
      - dev

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Server Configuration
  server:
    port: 8080

# Logging Configuration
logging:
  level:
    org.kine.backend: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:defaultSecret}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600} # in seconds
    issuer: ${JWT_ISSUER:kine-saas-backend}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800} # in seconds
