  web:
    container_name: kine-web
    image: marouanedbibih/kine-saas-web:dev-0.1.0
    build:
      context: ..
      dockerfile: docker/Dockerfile.web.yml
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    working_dir: /app
    command: pnpm dev
    depends_on:
      - backend
    networks:
      - kine_network

  backend:
    container_name: kine-backend
    image: marouanedbibih/kine-saas-backend:dev-0.1.0
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.yml
      target: dev
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    depends_on:
      - postgres
    networks:
      - kine_network


